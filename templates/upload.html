<link rel="stylesheet" href="{{ url_for('static', filename='upload.css') }}">

<div id="upload-container">
  <p>Select a file to upload or download a file from GitHub</p>

  <form id="upload-form" onsubmit="return false">
    <!-- Hidden real input -->
    <input
      id="file"
      type="file"
      onchange="document.getElementById('file-name').textContent = this.files[0]?.name || 'No file chosen'">

    <!-- Better looking UI -->
    <label for="file" id="file-ui">
      <span id="file-button">Choose File</span>
      <span id="file-name">No file chosen</span>
    </label>

    <input type="text" id="git-link" name="Git_Link" placeholder="GitHub file link">
    <button type="submit" id="submit-btn" disabled>Upload</button>
  </form>
</div>

<script>
  const form = document.getElementById('upload-form');
  const fileInput = document.getElementById('file');
  const gitInput  = document.getElementById('git-link');
  const submitBtn = document.getElementById('submit-btn');

  // Only enable submit button if one or the other is filled. Disable if none or both
  const updateButtonState = () => {
    const hasFile = fileInput.files && fileInput.files.length > 0;
    const hasLink = gitInput.value.trim().length > 0;
    const exactlyOne = (hasFile && !hasLink) || (!hasFile && hasLink);
    submitBtn.disabled = !exactlyOne;
  };

  fileInput.addEventListener('change', updateButtonState);
  gitInput.addEventListener('input', updateButtonState);

  form.addEventListener('submit', () => {
    const file = fileInput.files?.[0];
    const gitLink = gitInput.value.trim();

    // Download file if one has been uploaded
    if (file) {
      const url = URL.createObjectURL(file);
      const a = document.createElement('a');
      a.href = url;
      a.download = file.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } 
    // Otherwise fetch the file from Github
    else if (gitLink) {
      // Placeholder: later add GitHub fetch logic
    }

    // Reset UI
    form.reset();
    submitBtn.disabled = true;
  });
  updateButtonState();
</script>
